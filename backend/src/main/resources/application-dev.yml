spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:meteo}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:changeme}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:meteo}
    password: ${RABBITMQ_PASSWORD:changeme}
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false

# JWT 配置（密钥须通过环境变量注入，生产环境严禁写死）
meteo:
  jwt:
    secret: ${JWT_SECRET:changeme-change-me-in-production-env-at-least-32-bytes}
    access-token-expire-minutes: 120
    refresh-token-expire-days: 7
  influx:
    url: ${INFLUX_URL:http://localhost:8086}
    token: ${INFLUX_TOKEN:changeme}
    org: ${INFLUX_ORG:meteo}
    bucket: ${INFLUX_BUCKET:meteo}
  mqtt:
    broker: ${MQTT_BROKER:tcp://localhost:1883}
    username: ${MQTT_USER:meteo}
    password: ${MQTT_PASSWORD:changeme}
    topic: ${MQTT_TOPIC:meteo/+/up}
  # 数据模拟器（开发环境默认开启，生产必须置为 false）
  simulator:
    enabled: ${SIMULATOR_ENABLED:true}
