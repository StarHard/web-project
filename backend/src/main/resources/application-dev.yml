spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:meteo}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:changeme}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:meteo}
    password: ${RABBITMQ_PASSWORD:changeme}
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false
  # 决策智能体：走 OpenAI 兼容协议接入国产大模型（默认 DeepSeek）。
  # 换厂商只需改 base-url 与 model（通义/智谱均提供 OpenAI 兼容接口），不锁定供应商。
  # api-key 缺失或无效时助手接口降级为提示信息，不影响系统其它功能。
  ai:
    openai:
      base-url: ${LLM_BASE_URL:https://api.deepseek.com}
      api-key: ${LLM_API_KEY:changeme}
      chat:
        options:
          model: ${LLM_MODEL:deepseek-chat}
          temperature: 0.3
      # 知识库（RAG）向量化：DeepSeek 只提供 chat 接口，没有 embeddings（实测 /v1/embeddings 返回 404），
      # 因此 embedding 单独指向阿里云百炼（通义千问）的 OpenAI 兼容端点。
      # 两个坑：① base-url 不能带 /v1 —— Spring AI 会自动追加 embeddings-path（默认 /v1/embeddings），
      #         带上 /v1 会拼成 /compatible-mode/v1/v1/embeddings 而 404；
      #         ② model 必须带版本号（text-embedding-v3/v4），百炼的向量模型不带版本号调不通。
      # 下面两项会覆盖上面的 chat 配置，两者互不影响；未配置密钥时知识库标记为未就绪，
      # 检索工具会如实回答「未检索到依据」，而不是让模型凭常识作答。
      embedding:
        base-url: ${EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
        api-key: ${EMBEDDING_API_KEY:changeme}
        options:
          model: ${EMBEDDING_MODEL:text-embedding-v4}

# JWT 配置（密钥须通过环境变量注入，生产环境严禁写死）
meteo:
  jwt:
    secret: ${JWT_SECRET:changeme-change-me-in-production-env-at-least-32-bytes}
    access-token-expire-minutes: 120
    refresh-token-expire-days: 7
  # 决策智能体知识库（RAG）：语料为「气象服务」已发布文章
  rag:
    enabled: ${RAG_ENABLED:true}
    # 单次检索返回的片段数：过多会挤占上下文且引入噪声
    top-k: ${RAG_TOP_K:4}
    # 相似度下限：低于该值视为不相关，宁可不给依据也不给错依据
    min-score: ${RAG_MIN_SCORE:0.35}
    # 片段目标长度（字符）：合并短段落时的上限
    max-chunk-chars: ${RAG_MAX_CHUNK_CHARS:400}
  influx:
    url: ${INFLUX_URL:http://localhost:8086}
    token: ${INFLUX_TOKEN:changeme}
    org: ${INFLUX_ORG:meteo}
    bucket: ${INFLUX_BUCKET:meteo}
  mqtt:
    broker: ${MQTT_BROKER:tcp://localhost:1883}
    username: ${MQTT_USER:meteo}
    password: ${MQTT_PASSWORD:changeme}
    topic: ${MQTT_TOPIC:meteo/+/up}
    # 链路体检兜底（FR-QC-01）：定时检查连接与订阅是否仍有效
    health-check-delay-ms: ${MQTT_HEALTH_CHECK_DELAY_MS:60000}
    # 连接正常但超过该时长未收到任何上行消息，判定订阅可能失效并主动重订阅
    stale-threshold-ms: ${MQTT_STALE_THRESHOLD_MS:600000}
    # 断线后等待 automaticReconnect 恢复的上限，超过则主动重连兜底
    manual-reconnect-after-ms: ${MQTT_MANUAL_RECONNECT_AFTER_MS:300000}
  # 数据模拟器（开发环境默认开启，生产必须置为 false）
  simulator:
    enabled: ${SIMULATOR_ENABLED:true}
    interval-ms: ${SIMULATOR_INTERVAL_MS:15000}   # 开发环境15秒一条，加速联调
