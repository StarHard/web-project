# 本地/生产中间件编排（方案 B）
#
# ⚠ 本文件尚未实测验证：开发机未安装 Docker，编写后未实际执行过。
#    已验证的启动路径是方案 A（scripts/start-all.ps1），详见 deploy/README.md。
#
# 选用本方案前请先注意两点（详见 README「方案 B 说明」）：
#   1. 凭据口径与方案 A 不同 —— 这里在容器内新建 meteo/changeme，InfluxDB token 用的是
#      changeme-influx-admin-token；而方案 A 连的是本机实例（root/123456、guest/guest）
#      与脚本生成、保存在 tools/influx-token.txt 的 token。照抄启动后若不覆盖 MYSQL_USER、
#      MYSQL_PASSWORD、RABBITMQ_USER、RABBITMQ_PASSWORD、INFLUX_TOKEN，后端会连不上。
#   2. 本文件只声明中间件，后端与前端仍需单独启动；且未设 healthcheck/depends_on，
#      请等容器全部就绪后再启动后端。
#
# 建议把密码统一写在 deploy/.env（已被 .gitignore 忽略）中覆盖下面的默认值。

name: meteo

services:
  mysql:
    image: mysql:8.0
    container_name: meteo-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme}
      MYSQL_DATABASE: meteo
      MYSQL_USER: meteo
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci

  redis:
    image: redis:7
    container_name: meteo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: meteo-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: meteo
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-changeme}
    ports:
      - "5672:5672"
      - "15672:15672"   # 管理控制台
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  influxdb:
    image: influxdb:2.7
    container_name: meteo-influxdb
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD:-changeme123}
      DOCKER_INFLUXDB_INIT_ORG: meteo
      DOCKER_INFLUXDB_INIT_BUCKET: meteo
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:-changeme-influx-admin-token}
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2

  emqx:
    image: emqx/emqx:5.7
    container_name: meteo-emqx
    environment:
      EMQX_NAME: meteo
    ports:
      - "1883:1883"     # MQTT
      - "8083:8083"     # WebSocket
      - "18083:18083"   # Dashboard（默认 admin/public）
    volumes:
      - emqx_data:/opt/emqx/data

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  influxdb_data:
  emqx_data:
